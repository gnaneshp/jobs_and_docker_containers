name: Deployment (Container )
on:
  push:
    branches:
      - main
      - dev
env:
  CACHE_KEY: node-deps
  MONGODB_DB_NAME: sample_mflix
jobs:
  test:
    environment: testing
    container:
      image: node:22
    services:
      mongodb:
        # ports:
        #   - 27017:27017
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: gnaneshp
          MONGO_INITDB_ROOT_PASSWORD: secret_password
          MONGO_INITDB_DATABASE: sample_mflix
          
    runs-on: ubuntu-latest
    env:
      MONGODB_CONNECTION_PROTOCOL: mongodb
      MONGODB_CLUSTER_ADDRESS: mongodb
      MONGODB_USERNAME: gnaneshp
      MONGODB_PASSWORD: secret_password
      PORT: 8080
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ env.CACHE_KEY }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Check DNS
        run: |
          cat /etc/hosts
          getent hosts mongodb || true
          ping -c 2 mongodb || true
      - name: Run server
        run: npm start & npx wait-on http://127.0.0.1:$PORT # requires MongoDB Atlas to accept requests from anywhere!
      - name: Run tests
        run: npm test
      - name: Output information
        run: |
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        env:
          PORT: 3000
        run: |        
          echo "MONGODB_DB_NAME: $MONGODB_DB_NAME"
          echo "MONGODB_USERNAME: $MONGODB_USERNAME"
          echo "${{ env.PORT }}"
